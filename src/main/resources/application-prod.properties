# Production credentials must be supplied explicitly. Keep existing AES values
# until encrypted data has been migrated using a controlled rotation procedure.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
jwt.secret=${JWT_SECRET}
cms.security.aes-key=${CMS_AES_KEY}
cms.security.aes-salt=${CMS_AES_SALT}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
